plugins {
    id 'java'
    id 'net.minecraftforge.gradle' version '[6.0.24,6.2)'
}

group = 'de.rupturereborn'
version = '1.0.0'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

minecraft {
    mappings channel: 'official', version: '1.21.1'
    runs {
        client {
            workingDirectory project.file('run')
            property 'forge.logging.console.level', 'debug'
            mods { rupturereborn { source sourceSets.main } }
        }
    }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.21.1-52.0.29'
}

tasks.named('jar') {
    manifest { attributes 'Implementation-Title': 'Rupture Reborn', 'Implementation-Version': project.version }
}
